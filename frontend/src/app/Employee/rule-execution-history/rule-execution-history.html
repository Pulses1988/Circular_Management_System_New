<div class="container">

  <h2 class="page-title">
    Event Execution History
  </h2>

  <div class="table-container">

    <table class="table table-bordered">

      <thead>
        <tr>
          <th>Circular</th>
          <th>Event</th>
          <th>Rule</th>
          <th>Action</th>
          <th>Status</th>
          <th>Date</th>
          <th>Time</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let r of executions">

          <td>{{ r.entity_id }}</td>

          <td>{{ r.event_name }}</td>

          <td>{{ r.rule_name }}</td>

          <td>{{ r.action_name }}</td>

        <td>
        <span class="badge bg-success" *ngIf="r.status == 'SUCCESS'">
            ✔ {{ r.status }}
        </span>

        <span class="badge bg-danger" *ngIf="r.status == 'FAILED'">
            ✖ {{ r.status }}
        </span>
    </td>

    <td>{{ r.executed_at | date:'dd-MM-yyyy' }}</td>

    <td>{{ r.executed_at | date:'HH:mm:ss' }}</td>


        </tr>

      </tbody>

    </table>

  </div>

</div>
