<div class="h-screen gradient-bg flex items-center justify-center">

  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-8">

      <div class="logo">
        🏦
      </div>

      <h1 class="portal-title">SecureBank Portal</h1>

      <p class="portal-subtitle">
        Employee Access
      </p>

    </div>

    <!-- Forgot Password Card -->

    <div class="glass-card">

      <h2>Forgot Password</h2>

      <p class="description">
        Enter your Employee ID and registered Email ID.
        We'll send an OTP to your registered email.
      </p>

      <form [formGroup]="forgotForm" (ngSubmit)="sendOtp()">

        <!-- Employee ID -->

        <div class="form-group">

          <label>Employee ID</label>

          <input
            type="text"
            placeholder="EMP001"
            formControlName="employee_id">

        </div>

        <!-- Email -->

        <div class="form-group">

          <label>Email Address</label>

          <input
            type="email"
            placeholder="employee@securebank.com"
            formControlName="email">

        </div>

        <button
          type="submit"
          class="send-btn"
          [disabled]="loading">

          {{ loading ? 'Sending OTP...' : 'Send OTP' }}

        </button>

      </form>

      <!-- <a
        class="back-link"
        routerLink="/employee-login">

        ← Back to Login

      </a> -->  
    <a
  class="back-link"
  (click)="goToLogin()">

  ← Back to Login

</a>

    </div>

  </div>

</div>

<!-- ========================================================= -->
<!-- OTP POPUP -->
<!-- ========================================================= -->

<div class="popup-overlay" *ngIf="showOtpPopup">

  <div class="popup-card">

    <h2>Verify OTP</h2>

    <p>
      Enter the OTP sent to your registered email.
    </p>

    <form [formGroup]="otpForm" (ngSubmit)="verifyOtp()">

      <div class="form-group">

        <label>OTP</label>

        <input
          type="text"
          maxlength="6"
          placeholder="Enter OTP"
          formControlName="otp">

      </div>

      <button
        class="send-btn"
        type="submit"
        [disabled]="loading">

        Verify OTP

      </button>

    </form>

  </div>

</div>

<!-- ========================================================= -->
<!-- RESET PASSWORD POPUP -->
<!-- ========================================================= -->

<div class="popup-overlay" *ngIf="showResetPopup">

  <div class="popup-card">

    <h2>Reset Password</h2>

    <p>
      Enter your new password.
    </p>

    <form
      [formGroup]="resetForm"
      (ngSubmit)="resetPassword()">

      <div class="form-group">

        <label>New Password</label>

        <input
          type="password"
          placeholder="New Password"
          formControlName="newPassword">

      </div>

      <div class="form-group">

        <label>Confirm Password</label>

        <input
          type="password"
          placeholder="Confirm Password"
          formControlName="confirmPassword">

      </div>

      <button
        class="send-btn"
        type="submit"
        [disabled]="loading">

        Reset Password

      </button>

    </form>

  </div>

</div>
