<h2 class="dialog-title">
  <mat-icon>download</mat-icon>
  Export Report
</h2>

<div class="dialog-body">

  <div class="form-group">
    <label>Report Type</label>

    <select [(ngModel)]="reportData.reportType">
      <option value="Reading History">Reading History</option>
      <option value="Activity Summary">Activity Summary</option>
    </select>
  </div>

  <div class="form-row">

    <div class="form-group">
      <label>From Date</label>
      <input
        type="date"
        [(ngModel)]="reportData.fromDate">
    </div>

    <div class="form-group">
      <label>To Date</label>
      <input
        type="date"
        [(ngModel)]="reportData.toDate">
    </div>

  </div>

  <div class="form-group">
    <label>Read Status</label>

    <select [(ngModel)]="reportData.readStatus">
      <option value="All">All</option>
      <option value="Read">Read</option>
      <option value="Unread">Unread</option>
    </select>
  </div>

  <div class="form-group">
    <label>Approval Status</label>

    <select [(ngModel)]="reportData.approvalStatus">
      <option value="All">All</option>
      <option value="Approved">Approved</option>
      <option value="Pending">Pending</option>
      <option value="Rejected">Rejected</option>
    </select>
  </div>

  <div class="form-group">

    <label>Export Format</label>

    <div class="radio-group">

      <label>
        <input
          type="radio"
          name="format"
          value="PDF"
          [(ngModel)]="reportData.format">
        PDF
      </label>

      <label>
        <input
          type="radio"
          name="format"
          value="Excel"
          [(ngModel)]="reportData.format">
        Excel
      </label>

    </div>

  </div>

</div>

<div class="dialog-footer">

  <button
    class="cancel-btn"
    type="button"
    (click)="closeDialog()">
    Cancel
  </button>

  <button
    class="export-btn"
    type="button"
    (click)="exportReport()">

    <mat-icon>download</mat-icon>
    Export Report

  </button>

</div>
