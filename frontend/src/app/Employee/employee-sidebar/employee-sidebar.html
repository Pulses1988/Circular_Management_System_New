<!-- Mobile Hamburger Button -->
<button
  *ngIf="!isMobileOpen"
  class="fixed top-4 left-4 z-50 p-3 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white md:hidden focus:outline-none shadow-lg hover:shadow-xl transition-all duration-300"
  (click)="toggleMobileSidebar()"
>
  <mat-icon class="text-xl">menu</mat-icon>
</button>

<!-- Sidebar for Desktop -->
<div
  [class.w-72]="isSidebarOpen"
  [class.w-20]="!isSidebarOpen"
  [class.sidebar-dark]="isDarkMode"
  class="employee-sidebar hidden md:flex flex-col h-full 
         bg-white/95 dark:bg-black/80
         backdrop-blur-lg 
         text-gray-800 dark:text-gray-100
         transition-all duration-300 
         shadow-2xl 
         border-r border-gray-200/50 dark:border-gray-700/50"
  (mouseenter)="expandSidebar()"
  (mouseleave)="collapseSidebar()"
>

  <!-- Navigation Menu -->
  <nav class="flex flex-col flex-1 mt-4 space-y-1 px-3 overflow-y-auto">
    <div *ngFor="let item of employeeNavItems" class="group">

      <!-- Main Navigation Item -->
      <a
        [routerLink]="item.route"
        [routerLinkActiveOptions]="{ exact: item.exact || false }"
        routerLinkActive="bg-gradient-to-r from-blue-500 to-indigo-600 text-white shadow-lg"
        #rla="routerLinkActive"
        class="flex items-center p-3 rounded-xl transition-all duration-300 group cursor-pointer"
        [class.justify-center]="!isSidebarOpen"
      >

        <!-- Icon -->
        <mat-icon
          class="text-xl transition-colors duration-300
                 text-blue-600 dark:text-blue-300
                 group-hover:text-blue-800 dark:group-hover:text-blue-400"
          [class.text-white]="rla.isActive"
          [ngClass]="{
         'text-gray-900': !isDarkMode && !rla.isActive,
         'text-gray-100': isDarkMode && !rla.isActive,
         'text-white': rla.isActive
          }"
        >
          {{ item.icon }}
        </mat-icon>

        <!-- Label -->
        <span
          *ngIf="isSidebarOpen"
          class="ml-3 text-sm font-medium transition-colors duration-300
                 text-gray-700 dark:text-gray-300"
          [class.text-white]="rla.isActive"
           [ngClass]="{
           'text-gray-700': !isDarkMode && !rla.isActive,
           'text-gray-300': isDarkMode && !rla.isActive,
           'text-white': rla.isActive
           }"
        >
          {{ item.label }}
        </span>

      </a>

      <!-- Submenu -->
      <div
        *ngIf="item.subItems && isSidebarOpen"
        class="ml-6 mt-1 space-y-1 border-l-2 border-gray-200 pl-4"
      >
        <a
          *ngFor="let subItem of item.subItems"
          [routerLink]="subItem.route"
          [queryParams]="subItem.queryParams"
          routerLinkActive="bg-blue-100 text-blue-700 font-medium"
          class="flex items-center p-2 rounded-lg hover:bg-black transition-all duration-200 text-sm"
        >
          <mat-icon class="text-base mr-3 text-gray-500">{{ subItem.icon }}</mat-icon>
          <span>{{ subItem.label }}</span>

          <span
            *ngIf="subItem.badge"
            class="ml-auto px-1.5 py-0.5 text-xs font-bold bg-orange-100 text-orange-700 rounded-full"
          >
            {{ subItem.badge }}
          </span>
        </a>
      </div>

    </div>
  </nav>

  <!-- Logout Section -->
  <div class="p-4 border-t border-gray-200/50">
    <button
      class="w-full flex items-center p-3 hover:bg-red-50 rounded-xl text-red-600 hover:text-red-700 transition-all duration-300 group"
       [ngClass]="{
    'text-red-600 hover:text-red-700 hover:bg-red-50': !isDarkMode,
    'text-red-400 hover:text-red-200 hover:bg-red-800': isDarkMode
     }"
      [class.justify-center]="!isSidebarOpen"
      (click)="openLogoutDialog()"
    >
      <mat-icon class="text-xl group-hover:scale-110 transition-transform duration-300">logout</mat-icon>
      <span *ngIf="isSidebarOpen" class="ml-4 font-medium">Logout</span>
    </button>
  </div>

</div>

<!-- Mobile Sidebar Overlay -->
<div class="fixed inset-0 z-40 md:hidden" [class.pointer-events-none]="!isMobileOpen">

  <!-- Backdrop -->
  <div
    class="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity duration-300"
    [class.opacity-100]="isMobileOpen"
    [class.opacity-0]="!isMobileOpen"
    (click)="toggleMobileSidebar()"
  ></div>

  <!-- Mobile Sidebar -->
  <div
    class="absolute left-0 top-0 h-full w-80 
           bg-white/95 dark:bg-gray-900/95 
           backdrop-blur-lg shadow-2xl 
           text-gray-800 dark:text-gray-100
           transition-transform duration-300"
    [class.translate-x-0]="isMobileOpen"
    [class.-translate-x-full]="!isMobileOpen"
  >
    <div class="flex flex-col h-full">

      <!-- Mobile Header -->
      <div class="flex items-center justify-between h-20 px-6 bg-gradient-to-r from-blue-600 to-indigo-600 text-white">
        <div class="flex items-center space-x-3">
          <mat-icon class="text-2xl">account_balance</mat-icon>
          <div>
            <span class="font-bold text-lg">SecureBank</span>
            <span class="block text-xs text-blue-100">Employee Portal</span>
          </div>
        </div>

        <button class="p-2 hover:bg-white/20 rounded-lg" (click)="toggleMobileSidebar()">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <!-- Mobile Navigation -->
      <nav class="flex flex-col flex-1 mt-4 space-y-1 px-4 overflow-y-auto">
        <div *ngFor="let item of employeeNavItems" class="group">

          <a
            (click)="handleMobileNavClick(item)"
            [routerLink]="item.route"
            routerLinkActive="bg-gradient-to-r from-blue-500 to-indigo-600 text-white shadow-lg"
            class="flex items-center p-4 rounded-xl hover:bg-gradient-to-r hover:from-blue-50 hover:to-indigo-50 transition-all duration-300"
          >
            <mat-icon class="text-xl text-blue-600 group-hover:text-blue-700">{{ item.icon }}</mat-icon>
            <span class="ml-4 font-medium flex-1">{{ item.label }}</span>

            <span
              *ngIf="item.badge"
              class="px-2 py-1 text-xs font-bold rounded-full"
              [class.bg-red-100]="item.badgeType === 'urgent'"
              [class.text-red-700]="item.badgeType === 'urgent'"
              [class.bg-blue-100]="item.badgeType === 'info'"
              [class.text-blue-700]="item.badgeType === 'info'"
            >
              {{ item.badge }}
            </span>
          </a>

        </div>
      </nav>

      <!-- Mobile Logout -->
      <div class="p-4 border-t border-gray-200/50">
        <button
          class="w-full flex items-center p-4 hover:bg-red-50 rounded-xl text-red-600 hover:text-red-700 transition-all duration-300"
          (click)="openLogoutDialog()"
        >
          <mat-icon>logout</mat-icon>
          <span class="ml-4 font-medium">Logout</span>
        </button>
      </div>

    </div>
  </div>

</div>
