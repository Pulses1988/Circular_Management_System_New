<div
  class="fixed inset-0 bg-black bg-opacity-60 modal-backdrop flex justify-center items-start pt-16 z-50 overflow-auto"
>
  <div
    class="bg-white modal-content rounded-2xl w-full max-w-3xl mx-4 shadow-2xl border border-gray-100 overflow-hidden"
  >
    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-600 to-blue-700 px-8 py-5 relative">
      <h2 class="text-2xl font-bold text-white flex items-center">
        <i class="fas fa-user-plus mr-3"></i>
        {{ isEditMode ? 'Edit Branch Admin' : 'Add Branch Admin' }}
      </h2>
      <button
        (click)="closeModal()"
        class="absolute top-5 right-5 text-white hover:text-gray-200 transition-colors"
      >
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>

    <!-- Form -->
    <div class="p-8">
      <h1 class="text-2xl md:text-3xl font-bold text-blue-700 mb-2">
        {{ branchName }}
      </h1>
      <div class="w-20 h-1 bg-blue-500 rounded-full mb-4"></div>
      <form [formGroup]="adminForm" (ngSubmit)="submitForm()" class="space-y-6">
        <input type="hidden" formControlName="branch_id" />
        <!-- First Name -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700 flex items-center">
              <i class="fas fa-id-card text-gray-400 mr-2 w-4"></i> First Name
            </label>
            <input
              type="text"
              formControlName="first_name"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all placeholder-gray-400"
              placeholder="Enter first name"
            />
          </div>

          <!-- Middle Name -->
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700 flex items-center">
              <i class="fas fa-id-card text-gray-400 mr-2 w-4"></i> Middle Name
            </label>
            <input
              type="text"
              formControlName="middle_name"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all placeholder-gray-400"
              placeholder="Enter middle name"
            />
          </div>

          <!-- Last Name -->
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700 flex items-center">
              <i class="fas fa-id-card text-gray-400 mr-2 w-4"></i> Last Name
            </label>
            <input
              type="text"
              formControlName="last_name"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all placeholder-gray-400"
              placeholder="Enter last name"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <!-- Username -->
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700 flex items-center">
              <i class="fas fa-user text-gray-400 mr-2 w-4"></i> Username
            </label>
            <input
              type="text"
              formControlName="username"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all placeholder-gray-400"
              placeholder="Enter username"
            />
          </div>

          <!-- Password -->
          <div *ngIf="!isEditMode" class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700 flex items-center">
              <i class="fas fa-lock text-gray-400 mr-2 w-4"></i> Password
            </label>
            <input
              type="password"
              formControlName="password"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all placeholder-gray-400"
              placeholder="Enter password"
            />
          </div>

          <!-- Email -->
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-gray-700 flex items-center">
              <i class="fas fa-envelope text-gray-400 mr-2 w-4"></i> Email
            </label>
            <input
              type="email"
              formControlName="email"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all placeholder-gray-400"
              placeholder="Enter email address"
            />
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-end gap-4 pt-6 border-t border-gray-200 mt-6">
          <button
            type="button"
            (click)="closeModal()"
            class="px-6 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-gray-300"
          >
            Cancel
          </button>
          <button
            type="submit"
            [disabled]="adminForm.invalid"
            class="px-6 py-3 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-medium rounded-lg transition-all transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 shadow-lg hover:shadow-xl flex items-center disabled:opacity-50 disabled:transform-none"
          >
            <i [class]="isEditMode ? 'fas fa-save mr-2' : 'fas fa-plus mr-2'"></i>
            {{ isEditMode ? 'Update' : 'Add Admin' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
