<div class="flex h-screen bg-gradient-to-br from-blue-50 via-blue-100 to-blue-200">
  <!-- Mobile Hamburger Button -->
  <button
    *ngIf="!isMobileOpen"
    class="fixed top-4 left-4 z-50 p-2 rounded bg-blue-900 text-white md:hidden focus:outline-none"
    (click)="toggleMobileSidebar()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-6 w-6"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M4 6h16M4 12h16M4 18h16"
      />
    </svg>
  </button>

  <!-- Sidebar for Desktop -->
  <div
    [class.w-64]="isSidebarOpen"
    [class.w-20]="!isSidebarOpen"
    class="hidden md:flex flex-col bg-white text-gray-800 transition-all duration-300 shadow-lg"
    (mouseenter)="expandSidebar()"
    (mouseleave)="collapseSidebar()"
  >
    <div
      class="flex items-center justify-center border-b border-gray-200 overflow-hidden"
      [style.height.px]="isSidebarOpen ? 64 : 0"
      [style.opacity]="isSidebarOpen ? 1 : 0"
      [style.transition]="'height 0.5s ease, opacity 0.5s ease'"
    >
      <span class="font-bold text-lg">Admin Panel</span>
    </div>

    <nav class="flex flex-col mt-4 space-y-2 px-2">
      <a
        *ngFor="let item of filteredNavItems"
        [routerLink]="item.route"
        class="flex items-center p-3 rounded hover:bg-blue-100 transition-colors"
      >
        <mat-icon class="text-blue-600">{{ item.icon }}</mat-icon>
        <span *ngIf="isSidebarOpen" class="ml-3">{{ item.label }}</span>
      </a>
    </nav>

    <div class="mt-auto p-4 border-t border-gray-200">
  <button 
    class="w-full flex items-center p-2 hover:bg-red-100 rounded text-red-600 hover:text-red-700 transition-colors"
    (click)="openLogoutDialog()"
  >
    <mat-icon>logout</mat-icon>
    <span *ngIf="isSidebarOpen" class="ml-3">Logout</span>
  </button>
</div>
  </div>

  <!-- Mobile Sidebar Overlay -->
  <div
    class="fixed inset-0 z-40 md:hidden bg-white text-gray-800 shadow-lg transition-transform transform"
    [class.translate-x-0]="isMobileOpen"
    [class.-translate-x-full]="!isMobileOpen"
  >
    <div class="flex flex-col h-full">
      <div class="flex items-center justify-between h-16 p-4 border-b border-gray-200">
        <span class="font-bold text-lg">Admin Panel</span>
        <button (click)="toggleMobileSidebar()" class="focus:outline-none">
          <mat-icon class="text-blue-600">close</mat-icon>
        </button>
      </div>

      <nav class="flex flex-col mt-4 space-y-2 px-4">
        <a
          (click)="toggleMobileSidebar()"
          routerLink="/admin/dashboard"
          class="flex items-center p-3 rounded hover:bg-gray-100 transition-colors"
        >
          <mat-icon class="text-blue-600">dashboard</mat-icon>
          <span class="ml-3">Dashboard</span>
        </a>
        <a
          (click)="toggleMobileSidebar()"
          routerLink="/admin/admin-department-management"
          class="flex items-center p-3 rounded hover:bg-gray-100 transition-colors"
        >
          <mat-icon class="text-blue-600">calendar_view_week</mat-icon>
          <span class="ml-3">Department Management </span>
        </a>
        @if (role==='HO_ADMIN') {
        <a
          (click)="toggleMobileSidebar()"
          routerLink="/admin/admin-branch"
          class="flex items-center p-3 rounded hover:bg-gray-100 transition-colors"
        >
          <mat-icon class="text-blue-600">account_tree</mat-icon>
          <span class="ml-3">Branch Management</span>
        </a>
      }
        <a
          (click)="toggleMobileSidebar()"
          routerLink="/admin/admin-role-management"
          class="flex items-center p-3 rounded hover:bg-gray-100 transition-colors"
        >
          <mat-icon class="text-blue-600">assignment_ind</mat-icon>
          <span class="ml-3">Role Management</span>
        </a>
        <a
          (click)="toggleMobileSidebar()"
          routerLink="/admin/admin-employee-management"
          class="flex items-center p-3 rounded hover:bg-gray-100 transition-colors"
        >
          <mat-icon class="text-blue-600">manage_accounts</mat-icon>
          <span class="ml-3">Employee Management</span>
        </a>
      </nav>

      <div class="mt-auto p-4 border-t border-gray-200">
        <button class="w-full flex items-center p-2 hover:bg-gray-100 rounded">
          <mat-icon>logout</mat-icon>
          <span class="ml-3">Logout</span>
        </button>
      </div>
    </div>
  </div>
</div>
