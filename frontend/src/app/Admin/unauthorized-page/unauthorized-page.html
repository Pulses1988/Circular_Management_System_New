<div class="unauthorized-container">
      <div class="unauthorized-card">
        <div class="icon-container">
          <svg class="lock-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 10H20C21.1046 10 22 10.8954 22 12V20C22 21.1046 21.1046 22 20 22H4C2.89543 22 2 21.1046 2 20V12C2 10.8954 2.89543 10 4 10H6M18 10V8C18 5.79086 16.2091 4 14 4H10C7.79086 4 6 5.79086 6 8V10M18 10H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="16" r="2" fill="currentColor"/>
          </svg>
        </div>
        
        <div class="content">
          <h1 class="title">Access Denied</h1>
          <p class="message">
            You don't have permission to access this page. Please contact your administrator 
            if you believe this is an error.
          </p>
          
          <div class="user-info" *ngIf="currentUser">
            <p class="role-info">
              <span class="label">Current Role:</span>
              <span class="role-badge">{{ getCurrentRole() }}</span>
            </p>
          </div>
        </div>
        
        <div class="actions">
