<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 via-blue-100 to-blue-200 p-6">
  <div class="w-full max-w-4xl bg-white rounded-lg shadow-xl p-8">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="flex justify-center mb-4">
        <mat-icon class="text-blue-600 text-5xl">security</mat-icon>
      </div>
      <h2 class="text-3xl font-extrabold text-gray-800">Admin Registration</h2>
      <p class="text-gray-500 mt-2">Fill in the form below to create an admin account</p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" #signupForm="ngForm" novalidate>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Left Column -->
        <div class="space-y-5">
          <!-- Username -->
          <div>
            <label for="username" class="block text-gray-700 font-medium mb-1">Username *</label>
            <input 
              type="text" 
              id="username" 
              name="username" 
              [(ngModel)]="admin.username" 
              required
              #username="ngModel"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
              placeholder="Enter username"
            >
            <div *ngIf="username.invalid && username.touched" class="text-red-500 text-sm mt-1">
              Username is required
            </div>
          </div>

          <!-- First Name -->
          <div>
            <label for="firstName" class="block text-gray-700 font-medium mb-1">First Name *</label>
            <input 
              type="text" 
              id="firstName" 
              name="firstName" 
              [(ngModel)]="admin.first_name" 
              required
              #firstName="ngModel"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
              placeholder="Enter first name"
            >
            <div *ngIf="firstName.invalid && firstName.touched" class="text-red-500 text-sm mt-1">
              First name is required
            </div>
          </div>

          <!-- Middle Name -->
          <div>
            <label for="middleName" class="block text-gray-700 font-medium mb-1">Middle Name</label>
            <input 
              type="text" 
              id="middleName" 
              name="middleName" 
              [(ngModel)]="admin.middle_name"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
              placeholder="Enter middle name"
            >
          </div>
           <!-- Last Name -->
          <div>
            <label for="lastName" class="block text-gray-700 font-medium mb-1">Last Name *</label>
            <input 
              type="text" 
              id="lastName" 
              name="lastName" 
              [(ngModel)]="admin.last_name"
              required
              #lastName="ngModel"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
              placeholder="Enter last name"
            >
            <div *ngIf="lastName.invalid && lastName.touched" class="text-red-500 text-sm mt-1">
              Last name is required
            </div>
          </div>
        </div>

        <!-- Right Column -->
        <div class="space-y-5">
          <!-- Email -->
          <div>
            <label for="email" class="block text-gray-700 font-medium mb-1">Email Address *</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              [(ngModel)]="admin.email" 
              required
              email
              #email="ngModel"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
              placeholder="Enter email"
            >
            <div *ngIf="email.invalid && email.touched" class="text-red-500 text-sm mt-1">
              <span *ngIf="email.errors?.['required']">Email is required.</span>
              <span *ngIf="email.errors?.['email']">Please enter a valid email address.</span>
            </div>
          </div>

          <!-- Password -->
          <div>
            <label for="password" class="block text-gray-700 font-medium mb-1">Password *</label>
            <div class="relative">
              <input 
                [type]="showPassword ? 'text' : 'password'" 
                id="password" 
                name="password" 
                [(ngModel)]="admin.password" 
                required
                minlength="6"
                #password="ngModel"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                placeholder="Enter password"
              >
              <button 
                type="button" 
                class="absolute right-3 top-2 text-gray-500 hover:text-blue-600"
                (click)="togglePassword()"
              >
                <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
            </div>
            <div *ngIf="password.invalid && password.touched" class="text-red-500 text-sm mt-1">
              <span *ngIf="password.errors?.['required']">Password is required.</span>
              <span *ngIf="password.errors?.['minlength']">Password must be at least 6 characters.</span>
            </div>
          </div>

          <!-- Admin Type -->
          <div>
            <label for="adminType" class="block text-gray-700 font-medium mb-1">Admin Type *</label>
            <select 
              id="adminType" 
              name="adminType" 
              [(ngModel)]="admin.admin_type" 
              required
              #adminType="ngModel"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
            >
              <option value="" disabled>Select admin type</option>
              <option *ngFor="let type of availableAdminTypes" [value]="type.value">{{ type.label }}</option>
            </select>
            <div *ngIf="adminType.invalid && adminType.touched" class="text-red-500 text-sm mt-1">
              Admin type is required.
            </div>
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="mt-8 text-center">
        <button 
          type="submit" 
          [disabled]="!signupForm.valid"
          class="w-full md:w-auto bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <div class="flex items-center justify-center gap-2">
            <mat-icon>person_add</mat-icon>
            Create Admin Account
          </div>
        </button>
      </div>
    </form>
  </div>
</div>
