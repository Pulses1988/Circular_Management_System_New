
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 via-blue-100 to-blue-200 p-6">
  <div class="w-full max-w-md bg-white rounded-lg shadow-xl p-8">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="flex justify-center mb-4">
        <mat-icon class="text-blue-600 text-5xl">login</mat-icon>
      </div>
      <h2 class="text-3xl font-bold text-gray-800">Admin Login</h2>
      <p class="text-gray-500 mt-2">Enter your credentials to access the dashboard</p>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
      <!-- Username -->
      <div class="mb-6">
        <label for="username" class="block text-gray-700 font-medium mb-2">Username</label>
        <div class="relative">
          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="loginData.username"
            required
            #username="ngModel"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
            placeholder="Enter your username"
          >
          <mat-icon class="absolute right-3 top-3 text-gray-400">person</mat-icon>
        </div>
        <div *ngIf="username.invalid && username.touched" class="text-red-500 text-sm mt-1">
          Username is required
        </div>
      </div>

      <!-- Password -->
      <div class="mb-6">
        <label for="password" class="block text-gray-700 font-medium mb-2">Password</label>
        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="loginData.password"
            required
            minlength="6"
            #password="ngModel"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
            placeholder="Enter your password"
          >
          <button
            type="button"
            class="absolute right-3 top-3 text-gray-500 hover:text-blue-600"
            (click)="togglePassword()"
          >
            <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
        <div *ngIf="password.invalid && password.touched" class="text-red-500 text-sm mt-1">
          <span *ngIf="password.errors?.['required']">Password is required.</span>
          <span *ngIf="password.errors?.['minlength']">Password must be at least 6 characters.</span>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="mt-6">
        <button
          type="submit"
          [disabled]="!loginForm.valid"
          class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <div class="flex items-center justify-center gap-2">
            <mat-icon>login</mat-icon>
            Login
          </div>
        </button>
      </div>
    </form>
  </div>
</div>
